version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MEDICAL_RAG_DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
    volumes:
      - rag_data:/data
    depends_on:
      - qdrant
      - redis

  worker:
    build: .
    command: celery -A worker.celery_app.celery_app worker --loglevel=info
    environment:
      MEDICAL_RAG_DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - rag_data:/data
    depends_on:
      - redis
      - qdrant

  redis:
    image: redis:7-alpine

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"

volumes:
  rag_data:
